server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: stockbroker-backend

  # ---------- MySQL + Hibernate ----------
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/stockbroker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true

  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s

  # ---------- Kafka ----------
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: stockbroker-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.stockbroker.*"
        spring.json.use.type.headers: false

# ---------- Application settings ----------
app:
  jwt:
    # Base64-encoded 256-bit key. CHANGE THIS in production (env var JWT_SECRET).
    secret: ${JWT_SECRET:c3RvY2ticm9rZXItZGVtby1zZWNyZXQta2V5LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  kafka:
    topics:
      stock-ticks: stock-ticks
      subscription-events: subscription-events
  market:
    # Simulated market feed: publishes a tick for every stock at this interval
    simulator-enabled: ${MARKET_SIMULATOR_ENABLED:true}
    tick-interval-ms: ${MARKET_TICK_INTERVAL_MS:2000}
    history-size: 300

logging:
  level:
    com.stockbroker: INFO
    org.apache.kafka: WARN
